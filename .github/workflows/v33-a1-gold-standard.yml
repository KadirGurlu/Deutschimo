name: Deutschimo V33 A1 Gold Standard

on:
  push:
    branches: [v33-staging]
  pull_request:
    branches: [main, v33-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a1-content-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run validate:v33
      - run: npm run typecheck
      - run: npm run build
