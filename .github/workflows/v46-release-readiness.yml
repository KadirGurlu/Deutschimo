name: Deutschimo V46 Single Release Gate

on:
  push:
    branches: [v46-staging]
  pull_request:
    branches: [main, v46-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deutschimo-v46-single-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/deutschimo_v4611_gate
  DATABASE_POSTGRES_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/deutschimo_v4611_gate
  DATABASE_ENVIRONMENT: test
  RELEASE_GATE_ALLOW_ISOLATED_DB: "1"
  AUTO_INIT_NON_PRODUCTION_DATABASE: "true"
  SEED_PREVIEW_TEST_DATA: "false"

  AUTH_SECRET: v46-11-ci-auth-secret-32-characters-minimum-2026
  SECURITY_HASH_KEY: v46-11-ci-security-hash-key-32-characters-minimum
  CRON_SECRET: v46-11-ci-cron-secret-32-characters-minimum

  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
  REQUIRE_EMAIL_VERIFICATION: "false"
  BOOTSTRAP_ADMIN_ON_BUILD: "false"
  PLAYWRIGHT_SKIP_BUILD: "true"

jobs:
  release-gate:
    name: npm run release:gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: deutschimo_v4611_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d deutschimo_v4611_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@10.9.2
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: V46 centralized production release gate
        run: npm run release:gate

      - name: Upload release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deutschimo-v46-release-gate-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
