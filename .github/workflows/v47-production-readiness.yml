name: Deutschimo V47 Production Readiness

on:
  push:
    branches:
      - v47-staging
      - main

  pull_request:
    branches:
      - v47-staging
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  v47-release-gate:
    name: V47 isolated production-operability gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deutschimo_v47_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test

      # ------------------------------------------------------------
      # V46/V47 RELEASE GATE DATABASE SAFETY
      # ------------------------------------------------------------
      # Bu workflow yalnızca GitHub Actions tarafından oluşturulan
      # geçici PostgreSQL container'ını kullanır.
      #
      # Production / Preview / Neon kullanıcı veritabanı kullanılmaz.
      # ------------------------------------------------------------

      DATABASE_ENVIRONMENT: test
      RELEASE_GATE_ALLOW_ISOLATED_DB: "1"

      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deutschimo_v47_ci?schema=public
      DATABASE_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/deutschimo_v47_ci?schema=public

      # ------------------------------------------------------------
      # CI AUTH / SECURITY
      # ------------------------------------------------------------

      AUTH_SECRET: v47-ci-auth-secret-at-least-32-characters
      AUTH_TRUST_HOST: "true"
      SECURITY_HASH_KEY: v47-ci-security-hash-key-at-least-32-characters
      CRON_SECRET: v47-ci-cron-secret-at-least-32-characters

      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      BOOTSTRAP_ADMIN_ON_BUILD: "false"

      # ------------------------------------------------------------
      # V47 FEATURE SAFETY DEFAULTS
      # ------------------------------------------------------------

      V47_ANALYTICS_ENABLED: "false"
      V47_ACCOUNT_DELETION_ENABLED: "false"
      V47_LOG_LEVEL: warn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run V47 Production Release Gate
        run: npm run release:gate:v47